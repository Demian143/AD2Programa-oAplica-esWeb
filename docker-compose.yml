services:
  mysql:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: prompt-battle-db

    ports:
        - "3307:3306"

    env_file:
      - .env

    environment:
      MYSQL_DATABASE: prompt_battle
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      MYSQL_ROOT_PASSWORD: admin

    command: --bind-address=0.0.0.0